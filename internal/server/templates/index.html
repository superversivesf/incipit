{{template "base" .}}
{{define "title"}}Incipit Library{{end}}
{{define "content"}}
<h1>Library ({{.Total}} books)</h1>
<div class="book-grid">
{{range .Books}}
<div class="book-card">
    <a href="/book/{{.ID}}">
        {{if .CoverPath}}<img src="/covers/{{.ID}}.jpg" alt="{{.Title}}">{{end}}
        <span class="title">{{.Title}}</span>
        <span class="author">{{.Author}}</span>
    </a>
</div>
{{end}}
</div>
{{end}}
