{{define "title"}}Edit: {{.Book.Title}}{{end}}
{{define "content"}}
<h1>Edit: {{.Book.Title}}</h1>

<form method="post" action="/book/{{.Book.ID}}/edit" class="edit-form">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <fieldset>
        <legend>Metadata</legend>
        <label><span>Title</span><input type="text" name="title" value="{{.Book.Title}}"></label>
        <label><span>Author</span><input type="text" name="author" value="{{.Book.Author}}"></label>
        <label><span>Series</span><input type="text" name="series" value="{{.Book.Series}}"></label>
        <label><span>Series Index</span><input type="number" step="0.1" name="series_index" value="{{.Book.SeriesIndex}}"></label>
        <label><span>ISBN</span><input type="text" name="isbn" value="{{.Book.ISBN}}"></label>
        <label><span>Publisher</span><input type="text" name="publisher" value="{{.Book.Publisher}}"></label>
        <label><span>Published</span><input type="text" name="published" value="{{.Book.Published}}"></label>
        <label><span>Pages</span><input type="number" name="pages" value="{{.Book.Pages}}"></label>
        <label class="full"><span>Description</span><textarea name="description" rows="4">{{.Book.Description}}</textarea></label>
    </fieldset>

    <fieldset>
        <legend>Tags</legend>
        {{if .AllTags}}
        <div class="tag-checkboxes">
        {{range .AllTags}}
        <label class="tag-checkbox">
            <input type="checkbox" name="tags" value="{{.ID}}" {{if index $.BookTagIDs .ID}}checked{{end}}>
            {{.Name}}
        </label>
        {{end}}
        </div>
        {{else}}
        <p class="hint">No tags defined yet. Create some on the <a href="/tags">tags page</a>.</p>
        {{end}}
    </fieldset>

    <div class="actions">
        <button type="submit" class="btn">Save Changes</button>
        <a href="/book/{{.Book.ID}}" class="btn btn-secondary">Cancel</a>
    </div>
</form>

<h2>Cover</h2>
<form method="post" action="/book/{{.Book.ID}}/cover" enctype="multipart/form-data" class="upload-form">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <label>
        <span>New cover (JPEG):</span>
        <input type="file" name="cover" accept="image/jpeg" required>
    </label>
    <button type="submit" class="btn">Upload Cover</button>
</form>
{{end}}
